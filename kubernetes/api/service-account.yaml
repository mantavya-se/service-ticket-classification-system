apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-ticket-api
  namespace: service-ticket
  labels:
    app.kubernetes.io/name: service-ticket-api
    app.kubernetes.io/part-of: service-ticket-classifier

# This service account intentionally has no IAM role annotation.
# With EKS Pod Identity, Terraform/AWS creates a separate association between:
#   cluster + namespace + service account + IAM role.
automountServiceAccountToken: true
