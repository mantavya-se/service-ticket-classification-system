apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-ticket-api
  namespace: service-ticket
  labels:
    app.kubernetes.io/name: service-ticket-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: service-ticket-classifier
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-ticket-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-ticket-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: service-ticket-classifier
    spec:
      serviceAccountName: service-ticket-api
      terminationGracePeriodSeconds: 30

      containers:
        - name: api
          image: api-ecr-url
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: service-ticket-api-config
            - secretRef:
                name: service-ticket-db-secret

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
