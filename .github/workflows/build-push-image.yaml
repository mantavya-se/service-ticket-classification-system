name: Build and Push Images

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "835577334660"
  ECR_REGISTRY: 835577334660.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build:
    runs-on: arc-runner-set

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean Docker storage
        run: |
          set -euo pipefail

          docker system df || true
          docker builder prune -af || true
          docker image prune -af || true
          docker container prune -f || true

          echo "After cleanup:"
          docker system df || true
          df -h

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region "${AWS_REGION}" |
          docker login \
            --username AWS \
            --password-stdin "${ECR_REGISTRY}"

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build API image
        run: |
          docker build \
            -f app/Dockerfile \
            -t "${ECR_REGISTRY}/service-ticket-api:${IMAGE_TAG}" \
            .

      - name: Push API image
        run: docker push "${ECR_REGISTRY}/service-ticket-api:${IMAGE_TAG}"

      - name: Build frontend image
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        run: |
          docker build \
            --provenance=false \
            -f frontend/Dockerfile \
            -t "${ECR_REGISTRY}/service-ticket-frontend:${IMAGE_TAG}" \
            frontend

      - name: Push frontend image
        run: docker push "${ECR_REGISTRY}/service-ticket-frontend:${IMAGE_TAG}"

      - name: Build train image
        run: |
          docker build \
            -f ml/Dockerfile \
            -t "${ECR_REGISTRY}/service-ticket-train:${IMAGE_TAG}" \
            .

      - name: Push train image
        run: docker push "${ECR_REGISTRY}/service-ticket-train:${IMAGE_TAG}"

      - name: Build insert image
        run: |
          docker build \
            -f rag/Dockerfile \
            -t "${ECR_REGISTRY}/service-ticket-insert:${IMAGE_TAG}" \
            .

      - name: Push insert image
        run: docker push "${ECR_REGISTRY}/service-ticket-insert:${IMAGE_TAG}"

      - name: Build retrain image
        run: |
          docker build \
            -f retrain/Dockerfile \
            -t "${ECR_REGISTRY}/service-ticket-retrain:${IMAGE_TAG}" \
            .

      - name: Push retrain image
        run: docker push "${ECR_REGISTRY}/service-ticket-retrain:${IMAGE_TAG}"
        
      - name: Show published images
        run: |
          echo "Published image tag: ${IMAGE_TAG}"

          aws ecr describe-images \
            --repository-name service-ticket-api \
            --query 'imageDetails[].imageTags' \
            --output json

      - name: Clean Docker after build
        if: always()
        run: |
          docker builder prune -af || true
          docker image prune -af || true