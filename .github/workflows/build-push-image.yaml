name: Build and Push Images

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "835577334660"
  ECR_REGISTRY: 835577334660.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build:
    runs-on: arc-runner-set

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        run: |
          set -euo pipefail

          aws ecr get-login-password \
            --region "${AWS_REGION}" |
          docker login \
            --username AWS \
            --password-stdin "${ECR_REGISTRY}"

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}" \
            >> "$GITHUB_ENV"

      - name: Build and push API image
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/service-ticket-api:${IMAGE_TAG}"

          docker build \
            --provenance=false \
            -f app/Dockerfile \
            -t "${IMAGE}" \
            .

          docker push "${IMAGE}"

          docker image rm "${IMAGE}" || true
          docker builder prune -f || true

          df -h
          docker system df || true

      - name: Build and push frontend image
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/service-ticket-frontend:${IMAGE_TAG}"

          docker build \
            --provenance=false \
            --build-arg VITE_API_URL=/api \
            -f frontend/Dockerfile \
            -t "${IMAGE}" \
            frontend

          docker push "${IMAGE}"

          docker image rm "${IMAGE}" || true
          docker builder prune -f || true

          df -h
          docker system df || true

      - name: Build and push train image
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/service-ticket-train:${IMAGE_TAG}"

          docker build \
            --provenance=false \
            -f ml/Dockerfile \
            -t "${IMAGE}" \
            .

          docker push "${IMAGE}"

          docker image rm "${IMAGE}" || true
          docker builder prune -f || true

          df -h
          docker system df || true

      - name: Build and push insert image
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/service-ticket-insert:${IMAGE_TAG}"

          docker build \
            --provenance=false \
            -f rag/Dockerfile \
            -t "${IMAGE}" \
            .

          docker push "${IMAGE}"

          docker image rm "${IMAGE}" || true
          docker builder prune -f || true

          df -h
          docker system df || true

      - name: Build and push retrain image
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/service-ticket-retrain:${IMAGE_TAG}"

          docker build \
            --provenance=false \
            -f retrain/Dockerfile \
            -t "${IMAGE}" \
            .

          docker push "${IMAGE}"

          docker image rm "${IMAGE}" || true
          docker builder prune -f || true

          df -h
          docker system df || true

      - name: Show published images
        run: |
          set -euo pipefail

          echo "Published image tag: ${IMAGE_TAG}"

          for repository in \
            service-ticket-api \
            service-ticket-frontend \
            service-ticket-train \
            service-ticket-insert \
            service-ticket-retrain
          do
            echo "Images in ${repository}:"

            aws ecr describe-images \
              --repository-name "${repository}" \
              --query 'imageDetails[].imageTags' \
              --output json
          done