name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag pushed to ECR
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: service-ticket-cluster
  ECR_REGISTRY: 835577334660.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  deploy:
    runs-on: arc-runner-set

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure EKS access
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

          kubectl get nodes
      
      - name: Apply namespace
        run: |
          kubectl apply -f kubernetes/namespace.yaml

      - name: Apply service accounts
        run: |
          kubectl apply -f kubernetes/api/service-account.yaml
          kubectl apply -f kubernetes/jobs/service-ticket-job.yaml
      
      - name: Create Database secret
        run: |
          kubectl create secret generic service-ticket-db-secret \
            --namespace service-ticket \
            --from-literal=DB_USER="${{ secrets.DB_USER }}" \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --dry-run=client \
            -o yaml |
          kubectl apply -f -

      - name: Apply generated ConfigMaps
        run: |
          set -euo pipefail

          kubectl kustomize kubernetes/ > /tmp/rendered.yaml

          awk '
            BEGIN { RS="---"; ORS="---\n" }
            /kind: ConfigMap/ { print }
          ' /tmp/rendered.yaml |
          kubectl apply -f -

      - name: Prepare Train Job
        run: |
          set -euo pipefail

          cp kubernetes/jobs/train-job.yaml /tmp/train-job.yaml

          sed -i \
            "s|train-ecr-url|${ECR_REGISTRY}/service-ticket-train:${IMAGE_TAG}|g" \
            /tmp/train-job.yaml

          cat /tmp/train-job.yaml

      - name: Run Train Job
        run: |
          set -euo pipefail

          kubectl delete job service-ticket-train \
            --namespace service-ticket \
            --ignore-not-found

          kubectl apply -f /tmp/train-job.yaml

          kubectl wait \
            --namespace service-ticket \
            --for=condition=complete \
            job/service-ticket-train \
            --timeout=30m || {
              echo "Training job failed or timed out"
              kubectl describe job service-ticket-train -n service-ticket
              kubectl get pods -n service-ticket -l job-name=service-ticket-train -o wide
              kubectl logs -n service-ticket -l job-name=service-ticket-train --all-containers=true --tail=-1 || true
              exit 1
            }

      - name: Verify production model in S3
        run: |
          aws s3api head-object \
            --bucket service-ticket-data-835577334660 \
            --key models/production/ticket-classifier.joblib

          echo "Production model successfully uploaded to S3"